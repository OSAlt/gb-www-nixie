services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: nixie
      POSTGRES_PASSWORD: nixie_password
      POSTGRES_DB: nixiedb
    ports:
      - "5432:5432"
    networks:
      - dev_network
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nixie -d nixiedb"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  dev_network:
    name: dev_network

volumes:
  db_data:
