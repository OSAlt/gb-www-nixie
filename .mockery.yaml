# Regenerate with `mage mocks` (or `mage generate`).
# Mocks live in internal/mocks and replace hand-written test doubles.
# Config format: mockery v3 (https://vektra.github.io/mockery/v3/).
template: testify
template-data:
  unroll-variadic: true
dir: "internal/mocks"
pkgname: "mocks"
filename: "mock_{{.InterfaceName}}.go"
structname: "Mock{{.InterfaceName}}"
packages:
  github.com/OSAlt/gb-www-nixie/internal/ports:
    interfaces:
      MediaService:
      ContentCacheStore:
      MediaRefresher:
      BlogRefresher:
      ContactRefresher:
      ContactService:
      DBService:
      BlogService:
      Transaction:
      UnitOfWork:
  github.com/OSAlt/gb-www-nixie/internal/adapters/social:
    interfaces:
      Fetcher:
      BulkFetcher:
