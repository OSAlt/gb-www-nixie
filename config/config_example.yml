## Example config. Copy to config/config.yaml (config/config.yml also works).
port: "8080"
database_url: "" ## set this via env using DATABASE_URL

# RSS/Atom feeds merged into /blog. Only feeds listed here are loaded.
blog_urls:
  - https://www.geekbeacon.org/tag/geekbeacon-fest/rss/
  - https://www.geekbeacon.org/tag/geeksabroad/rss/
  - https://www.geekbeacon.org/tag/youtube/rss/
  # Currently returns 404; the blog logs a warning and skips it until it exists.
  - https://www.geekbeacon.org/tag/pixelplayback/rss/

# Latest videos on the home page. The YouTube Data API is used when
# YOUTUBE_API_KEY is set; otherwise these public feeds are tried.
# media_feed_urls:
#   - https://www.youtube.com/feeds/videos.xml?channel_id=UCMyAVYPgP_179gj9OIJZd4A
#   - https://www.youtube.com/feeds/videos.xml?channel_id=UCBE-FO9JUOghSysV9gjTeHw

# How often the background job refreshes the shared video cache, in seconds.
# The same value is the cache's freshness window. Default: 1800 (30 minutes).
# media_refresh_seconds: 1800

# Blog cache (default 30 minutes) and contact-subject cache (default 6 hours).
# blog_refresh_seconds: 1800
# contact_refresh_seconds: 21600

newsletters:
  - name: "geekbeacon"
    description: "geekbeacon news and updates. Stay current with all the community news!"
    url: "https://geekbeacon.org/#/portal"
